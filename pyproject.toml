[tool.poetry]
name = "fastapi-book-catalog"
version = "0.1.0"
description = "FastAPI book catalog"
authors = ["Manuel <manuel.ferreira@ctw.bmwgroup.com>"]
readme = "README.md"
packages = [{ include = "project" }]
 
[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.116.1,<0.117.0"
uvicorn = ">=0.35.0,<0.36.0"
pyyaml = ">=6.0.2,<7.0.0"
pydantic = ">=2.11.7,<3.0.0"
 
[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
httpx = "^0.28.1"
pre-commit = "^4.3.0"
black = "^23.12.0"
isort = "^6.0.0"
mypy = "^1.5.1"
types-pyyaml = "^6.0.12.20250809"
 
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.flake8]
max-line-length = 120

[tool.mypy]
ignore_missing_imports = true